# Worker limits for a shared 1GB host.
#
# The image ships MaxRequestWorkers 16, which is already conservative for a
# machine of its own. This host has ~950MB of RAM, 2GB of swap, and another
# application's database resident, so 16 mod_php children would reach swap
# under very ordinary load and the symptom would be latency, not an error.
#
# Six is ample: the only client is a phone app and one admin dashboard.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers        6
    MaxConnectionsPerChild 500
</IfModule>
